[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests of isolated MEGaNorm behavior",
    "integration: tests of MEGaNorm interactions with scientific dependencies",
    "slow: tests excluded from the fast pull-request suite",
]
