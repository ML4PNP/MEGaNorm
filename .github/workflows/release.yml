# Build & Publish
#
# Triggered by pushing a version tag, for example:
#
#   git tag v0.2.1
#   git push origin v0.2.1
#
# The workflow:
#   1. Builds the Python package
#   2. Publishes it to PyPI
#   3. Builds a multi-platform Docker image
#   4. Publishes versioned and "latest" images to Docker Hub
#

name: Build & Publish

on:
  push:
    tags:
      - "v*"


jobs:

  # =========================================================================
  # Build package and publish to PyPI
  # =========================================================================

  build-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # Build using the minimum Python version supported by MEGaNorm.
      # Package compatibility itself is defined in pyproject.toml.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build package
        run: |
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          twine upload dist/*


  # =========================================================================
  # Build and publish Docker image
  # =========================================================================

  docker-publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest

    # Do not publish the Docker image unless the PyPI publication succeeded.
    needs: build-publish

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # Enables emulation required for building ARM images on the
      # GitHub-hosted AMD64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Convert a Git tag such as v0.2.1 into Docker image tags.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: smkia/meganorm
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=MEGaNorm
            org.opencontainers.image.description=Normative modeling of MEG brain dynamics
            org.opencontainers.image.source=https://github.com/ML4PNP/MEGaNorm

      # Build one multi-platform image manifest containing both
      # AMD64 and ARM64 variants.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
