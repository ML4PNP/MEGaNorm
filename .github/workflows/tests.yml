name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            setup.py

      - name: Check release metadata
        run: python tools/sync_metadata.py --check

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q -m "not slow"

  hbr-smoke:
    if: github.event_name == 'workflow_dispatch'
    name: Slow integration checks (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run HBR workflow and IRASA decomposition checks
        run: python -m pytest -q -m slow

  documentation:
    name: Documentation (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and documentation dependencies
        run: python -m pip install . -r docs/requirements.txt
      - name: Build documentation with warnings treated as errors
        run: python -m sphinx -W --keep-going -b html docs/source docs/build/html
